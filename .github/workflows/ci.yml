name: SentinelCore Security & Integration CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinelcore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static Application Security Testing (SAST)
        run: |
          # Bandit scans for common security issues (hardcoded secrets, insecure crypto, etc.)
          bandit -r src/ -ll

      - name: Dependency Vulnerability Audit
        run: pip-audit --desc --strict

      - name: Provision PostgreSQL Schema & RLS Policies
        run: |
          python src/db/init_db.py

      - name: Execute Pytest Regression Suite
        run: |
          python -m pytest -v
